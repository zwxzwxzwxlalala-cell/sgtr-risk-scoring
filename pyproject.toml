[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sgtr-demo"
version = "0.1.0"
description = "Synthetic demonstration of stable-state gated temporal regularization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
